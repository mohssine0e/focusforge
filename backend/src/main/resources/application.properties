spring.application.name=focusforge

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/focusforge
spring.datasource.username=mohssine
spring.datasource.password=mohssine
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Logging
logging.level.com.focusforge=DEBUG