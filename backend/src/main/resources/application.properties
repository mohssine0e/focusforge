spring.application.name=focusforge

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/focusforge}
spring.datasource.username=${DB_USERNAME:mohssine}
spring.datasource.password=${DB_PASSWORD:mohssine}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Logging
logging.level.com.focusforge=DEBUG

# Security
focusforge.security.token-secret=${FOCUSFORGE_TOKEN_SECRET:focusforge-dev-secret-change-me}
focusforge.security.token-expiration-seconds=${FOCUSFORGE_TOKEN_EXPIRATION_SECONDS:604800}
